name: Sprawdź terminy WOMP

on:
  schedule:
    # Co 30 minut (czas UTC). GitHub może opóźnić start o kilka–kilkanaście minut.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # ręczne uruchomienie z zakładki Actions

# Potrzebne, żeby akcja mogła zacommitować last_date.txt
permissions:
  contents: write

# Nie dopuszczamy do dwóch równoległych przebiegów (konflikt przy push)
concurrency:
  group: womp-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Uruchom monitor
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:   ${{ secrets.SMTP_PORT }}
          SMTP_USER:   ${{ secrets.SMTP_USER }}
          SMTP_PASS:   ${{ secrets.SMTP_PASS }}
          MAIL_TO:     ${{ secrets.MAIL_TO }}
          MAIL_FROM:   ${{ secrets.MAIL_FROM }}
        run: python monitor.py

      - name: Zapisz stan (commit last_date.txt, jeśli się zmienił)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_date.txt
          if git diff --cached --quiet; then
            echo "Stan bez zmian – brak commita."
          else
            git commit -m "Aktualizacja terminu: $(cat last_date.txt)"
            git pull --rebase --quiet
            git push
          fi
